<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 56" width="210" height="56" role="img">
  <title>Finovly</title>
  <!-- Mark: ascending bars with F-cap -->
  <!-- Cap (top horizontal bar) -->
  <rect x="0" y="5" width="41" height="7" fill="#ffffff" rx="2"/>
  <!-- Bar 1 – short, left -->
  <rect x="0" y="33" width="11" height="18" fill="#1D9E75" rx="2"/>
  <!-- Bar 2 – medium, center -->
  <rect x="15" y="22" width="11" height="29" fill="#1D9E75" rx="2"/>
  <!-- Bar 3 – tall, right -->
  <rect x="30" y="10" width="11" height="41" fill="#1D9E75" rx="2"/>
  <!-- Wordmark -->
  <text x="56" y="38"
    fill="#ffffff"
    font-size="27"
    font-weight="700"
    font-family="-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif"
    letter-spacing="-0.6">Finovly</text>
</svg>
